<div class="selector-content">
    <h2>Select a Module</h2>

    <div id="module-options-container" class="module-options-grid"></div>

    <div id="levelConfigContainer" class="level-config-container is-hidden">
        <label for="levelConfigInput" id="levelConfigLabel">Starting Level:</label>
        <input type="number" id="levelConfigInput" class="level-input" value="1" min="1" disabled>
    </div>
</div>
